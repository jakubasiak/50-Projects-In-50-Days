<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
    <title>Background Slider</title>
</head>

<body>
    <div class="slider-container">
        <div class="slide active"
            style="background-image: url('https://plus.unsplash.com/premium_photo-1691414363231-836e2e1bf0ed?q=80&w=3540&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');">
        </div>
        <div class="slide"
            style="background-image: url('https://media.istockphoto.com/id/1251375173/photo/panoramic-view-of-central-copenhagen.jpg?s=2048x2048&w=is&k=20&c=s1qbNrOnQ9x89vTMhdHa6qpwNqIe8A7dZPAb-4lTd-w=');">
        </div>
        <div class="slide"
            style="background-image: url('https://media.istockphoto.com/id/1470480025/photo/copenhagen-denmark-nyhavn-kobenhavns-iconic-canal-colorful-sunrise-water-reflection.jpg?s=2048x2048&w=is&k=20&c=T3smD7577DRJB841FejZyarWBfRc_S0W09kiAU8dSmM=');">
        </div>
        <div class="slide"
            style="background-image: url('https://media.istockphoto.com/id/2157984783/photo/copenhagen-skyline-with-water.jpg?s=2048x2048&w=is&k=20&c=WFopKojsDFEV5oW5ujroP6R9JITgrh3_Qiqpfra5Fxs=');">
        </div>
        <div class="slide"
            style="background-image: url('https://media.istockphoto.com/id/1476147466/photo/cargo-bike-ride-with-mom.jpg?s=2048x2048&w=is&k=20&c=wSgZazxaLYBIgN9GeANi8WI24KmRAoKGY9YuDkbNj3Y=');">
        </div>
        <button class="arrow left-arrow" id="left">
            <i class="fas fa-arrow-left"></i>
        </button>
        <button class="arrow right-arrow" id="right">
            <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <script src="script.js"></script>
</body>

</html>
